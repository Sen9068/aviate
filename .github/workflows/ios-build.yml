# Free build path: produces an unsigned .ipa that Sideloadly (Windows) signs with a
# free Apple ID and installs on a connected iPhone. See README → "Free: sideload from Windows".
name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Aviate.xcodeproj \
            -scheme Aviate \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Aviate.xcodeproj \
            -scheme Aviate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Aviate.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # An .ipa is just the .app inside a zipped "Payload" folder.
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Aviate.xcarchive/Products/Applications/Aviate.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry Aviate-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Aviate-unsigned-ipa
          path: ${{ runner.temp }}/ipa/Aviate-unsigned.ipa
          retention-days: 14
